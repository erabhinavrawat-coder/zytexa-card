<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zytexa Company Card</title>
<style>body{margin:0}</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400..600&family=Unbounded:wght@500..700&display=swap">
<style>
  /* Layout: one tall badge-shaped company card. Official logo plate and tagline on top, quick contact
     and Share, then the 14 services (four pillars, each service expands with full detail), why Zytexa,
     process, technologies, contact and QR. Palette and fonts follow zytexa.com. */
  :root {
    /* page, light (the site's light-section tokens) */
    --bg: #F4F7FF;
    --fg: #0A1636;
    --muted: #4A5A80;
    --glow-a: rgba(70, 130, 255, .16);
    --glow-b: rgba(25, 200, 225, .12);

    /* the card keeps the site's dark brand face in both themes */
    --night: #040A1C;
    --deep: #0A1636;
    --royal: #1446A0;
    --blue: #4682FF;
    --cyan: #19C8E1;
    --ice: #EAF3FF;
    --mist: #98A8CC;
    --card-a: #0D1C44;
    --card-b: #081432;
    --c-line: rgba(152, 168, 204, .16);
    --c-line-strong: rgba(152, 168, 204, .3);
    --err: #FF7A8A;

    --display: "Unbounded", "Segoe UI", system-ui, sans-serif;
    --body: "Onest", "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #040A1C; --fg: #EAF3FF; --muted: #98A8CC;
      --glow-a: rgba(20, 70, 160, .38); --glow-b: rgba(25, 200, 225, .08);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #040A1C; --fg: #EAF3FF; --muted: #98A8CC;
    --glow-a: rgba(20, 70, 160, .38); --glow-b: rgba(25, 200, 225, .08);
    color-scheme: dark;
  }

  *, *::before, *::after { box-sizing: border-box; }
  body {
    background:
      radial-gradient(60% 40% at 50% 0%, var(--glow-a), transparent 70%),
      radial-gradient(40% 30% at 10% 100%, var(--glow-b), transparent 70%),
      var(--bg);
    background-attachment: fixed;
    color: var(--fg); font: 15px/1.55 var(--body); -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3, h4, p, ul, ol { margin: 0; padding: 0; }
  ul, ol { list-style: none; }
  svg { display: block; }
  button { font: inherit; color: inherit; }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; border-radius: 8px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .ico { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  .page {
    width: 100%; max-width: 540px; margin-inline: auto;
    padding-block: 28px 44px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }

  /* ---------- the card ---------- */
  .tilt { perspective: 1200px; }
  .card {
    --rx: 0deg; --ry: 0deg;
    position: relative; overflow: hidden; isolation: isolate;
    padding: 18px 24px 28px; border-radius: 28px; color: var(--ice);
    background:
      radial-gradient(70% 22% at 85% 0%, rgba(20, 70, 160, .5), transparent 70%),
      radial-gradient(60% 16% at 0% 100%, rgba(25, 200, 225, .1), transparent 70%),
      linear-gradient(160deg, var(--card-a) 0%, var(--card-b) 100%);
    border: 1px solid var(--c-line-strong);
    box-shadow: 0 40px 90px -34px rgba(4, 10, 28, .75), inset 0 0 0 1px rgba(70, 130, 255, .1);
    transform: rotateX(var(--rx)) rotateY(var(--ry));
    transition: transform .3s ease;
    animation: rise .75s cubic-bezier(.2, .8, .2, 1) both;
  }
  .card::after {
    content: ""; position: absolute; inset: 0; z-index: 0; pointer-events: none;
    background: radial-gradient(460px circle at var(--gx, 50%) var(--gy, 0%), rgba(25, 200, 225, .12), transparent 46%);
  }
  .card > * { position: relative; z-index: 1; }

  .slot { width: 62px; height: 9px; margin: 0 auto 20px; border-radius: 999px; background: var(--night); border: 1px solid var(--c-line-strong); }

  .logo-plate { background: #fff; border-radius: 22px; padding: 14px 18px; display: grid; place-items: center; box-shadow: 0 18px 40px -22px rgba(0, 0, 0, .6); }
  .logo-plate img { width: min(100%, 320px); height: auto; }
  .lead { margin-top: 24px; text-align: center; font: 600 clamp(1.3rem, 6.4vw, 1.65rem)/1.2 var(--display); letter-spacing: -.015em; text-wrap: balance; }
  .lead em { font-style: normal; color: var(--cyan); }
  .about { margin-top: 12px; text-align: center; color: var(--mist); font-size: .9rem; max-width: 42ch; margin-inline: auto; }

  .quick { margin-top: 22px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .quick a {
    min-height: 62px; border-radius: 18px; border: 1px solid rgba(25, 200, 225, .32); background: rgba(25, 200, 225, .08);
    display: grid; place-items: center; align-content: center; gap: 4px; text-decoration: none; font-size: .8rem; font-weight: 600; color: var(--ice);
    transition: background .25s ease, border-color .25s ease, transform .25s ease;
  }
  .quick a svg { color: var(--cyan); }
  .quick a:hover { background: rgba(25, 200, 225, .2); border-color: var(--cyan); transform: translateY(-2px); }

  .btn {
    min-height: 50px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--c-line-strong);
    background: rgba(10, 22, 54, .6); color: var(--ice); display: inline-flex; align-items: center; justify-content: center; gap: 9px;
    font-weight: 600; cursor: pointer; text-decoration: none; transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease;
  }
  .btn:hover { transform: translateY(-2px); border-color: var(--cyan); }
  .btn:active { transform: scale(.98); }
  .btn-main { background: var(--cyan); color: #021226; border-color: transparent; }
  .btn-main:hover { border-color: transparent; box-shadow: 0 10px 40px -8px rgba(25, 200, 225, .65); }
  .btn-sm { min-height: 42px; font-size: .88rem; padding: 0 14px; }
  .btn-share { width: 100%; margin-top: 10px; }

  .rule { height: 2px; margin: 30px 0 24px; border-radius: 2px; background: linear-gradient(90deg, var(--blue), var(--cyan) 60%, transparent); }
  .kicker { font: 600 .66rem/1 var(--display); letter-spacing: .2em; text-transform: uppercase; color: var(--cyan); }
  h2.title { margin-top: 12px; font: 600 clamp(1.35rem, 6vw, 1.7rem)/1.14 var(--display); letter-spacing: -.02em; text-wrap: balance; }
  h2.title em { font-style: normal; color: var(--cyan); }
  .sub { margin-top: 10px; color: var(--mist); max-width: 44ch; }
  .hint { margin-top: 8px; color: var(--mist); font-size: .8rem; }

  /* ---------- services ---------- */
  .pillar { margin-top: 28px; }
  .pillar-head { display: flex; align-items: center; gap: 13px; margin-bottom: 8px; }
  .pic { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; flex: none; color: var(--cyan); background: rgba(25, 200, 225, .1); border: 1px solid rgba(25, 200, 225, .32); }
  .pillar-head > div { min-width: 0; flex: 1; }
  .pillar-name { font: 700 1.2rem/1.1 var(--display); letter-spacing: -.02em; }
  .pillar-desc { margin-top: 4px; color: var(--mist); font-size: .84rem; line-height: 1.45; }
  .pcount { font-size: .74rem; color: var(--mist); white-space: nowrap; align-self: flex-start; padding-top: 4px; }
  .ptools { margin: 4px 0 8px; font-size: .78rem; color: var(--mist); }
  .ptools b { color: var(--ice); font-weight: 600; }

  .svcs { border-top: 1px solid var(--c-line); }
  .svc { border-bottom: 1px solid var(--c-line); }
  .srow { text-decoration:none; display:flex; align-items:center; gap:12px; min-height:56px; padding:9px 2px; border-radius:12px; }
  .srow:hover b { color: var(--cyan); }
  .svc summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 10px 2px; border-radius: 12px; }
  .svc summary::-webkit-details-marker { display: none; }
  .num { font: 600 .7rem/1 var(--display); color: var(--cyan); letter-spacing: .06em; width: 22px; flex: none; font-variant-numeric: tabular-nums; }
  .stxt { min-width: 0; flex: 1; display: grid; }
  .stxt b { font-weight: 600; font-size: .96rem; }
  .stxt small { color: var(--mist); font-size: .8rem; line-height: 1.4; }
  .chev { color: var(--mist); transition: transform .25s ease; }
  .svc[open] .chev { transform: rotate(180deg); color: var(--cyan); }
  .svc summary:hover b { color: var(--cyan); }
  .svc-body { padding: 2px 4px 20px 34px; display: grid; gap: 14px; }
  .svc-intro { font-size: .88rem; color: #DCE6FF; line-height: 1.55; }
  .h4 { font: 600 .62rem/1 var(--display); letter-spacing: .18em; text-transform: uppercase; color: var(--mist); margin-bottom: 8px; }
  .inc { display: grid; gap: 7px; }
  .inc li { position: relative; padding-left: 18px; font-size: .86rem; color: #DCE6FF; line-height: 1.45; }
  .inc li::before { content: ""; position: absolute; left: 0; top: .5em; width: 7px; height: 7px; border-radius: 50%; background: linear-gradient(135deg, var(--blue), var(--cyan)); }
  .fit li { font-size: .86rem; color: #DCE6FF; line-height: 1.45; padding: 10px 12px; border-radius: 14px; border: 1px solid var(--c-line); background: rgba(4, 10, 28, .35); }
  .fit { display: grid; gap: 8px; }
  .note { font-size: .82rem; color: var(--cyan); }
  .chips { display: flex; flex-wrap: wrap; gap: 7px; }
  .chip { font-size: .76rem; padding: 5px 11px; border-radius: 999px; border: 1px solid var(--c-line-strong); color: var(--ice); background: rgba(4, 10, 28, .4); }
  .svc-cta { display: flex; flex-wrap: wrap; gap: 8px; }

  /* ---------- why / process / stack ---------- */
  .usps { margin-top: 16px; display: grid; gap: 10px; }
  .usp { padding: 16px 16px 16px 16px; border-radius: 18px; border: 1px solid var(--c-line); background: rgba(12, 26, 61, .45); }
  .usp h3 { font: 600 .98rem/1.25 var(--display); letter-spacing: -.01em; }
  .usp p { margin-top: 6px; color: var(--mist); font-size: .86rem; }

  .phases { margin-top: 16px; display: grid; gap: 4px; }
  .phase { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 14px; padding: 10px 0; }
  .dot { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; border: 2px solid var(--cyan); color: var(--cyan); font: 600 .85rem/1 var(--display); box-shadow: 0 0 24px -6px rgba(25, 200, 225, .6); }
  .phase h3 { font: 600 1rem/1.25 var(--display); padding-top: 4px; }
  .phase p { margin-top: 4px; color: var(--mist); font-size: .86rem; }

  .stack { margin-top: 16px; display: grid; gap: 14px; }

  /* ---------- contact ---------- */
  .rows { margin-top: 14px; border-top: 1px solid var(--c-line); }
  .row { display: flex; align-items: center; gap: 4px; border-bottom: 1px solid var(--c-line); }
  .row-main { flex: 1; min-width: 0; display: flex; align-items: center; gap: 13px; padding: 12px 6px 12px 0; text-decoration: none; border-radius: 14px; }
  .ic { width: 42px; height: 42px; border-radius: 13px; display: grid; place-items: center; flex: none; color: var(--cyan); background: rgba(25, 200, 225, .1); border: 1px solid rgba(25, 200, 225, .32); transition: background .25s ease, border-color .25s ease; }
  .row-main:hover .ic { background: rgba(25, 200, 225, .22); border-color: var(--cyan); }
  .txt { min-width: 0; display: grid; }
  .txt b { font-weight: 600; font-size: .93rem; }
  .txt small { color: var(--mist); font-size: .83rem; overflow-wrap: anywhere; user-select: text; }
  .copy { width: 40px; height: 40px; border: 0; border-radius: 12px; background: transparent; color: var(--mist); display: grid; place-items: center; cursor: pointer; flex: none; }
  .copy:hover { background: rgba(152, 168, 204, .1); color: var(--cyan); }

  .qr-block { margin-top: 30px; display: grid; justify-items: center; gap: 12px; text-align: center; }
  .qr { width: 168px; max-width: 100%; aspect-ratio: 1; padding: 11px; border-radius: 18px; background: #fff; display: grid; place-items: center; color: var(--deep); font-size: .8rem; }
  .qr svg { width: 100%; height: auto; }
  .qr-cap { color: var(--mist); font-size: .85rem; max-width: 30ch; }
  .url { max-width: 100%; padding: 8px 12px; border-radius: 12px; border: 1px solid var(--c-line); background: rgba(4, 10, 28, .4); font: 11.5px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: var(--mist); overflow-wrap: anywhere; user-select: all; }
  .foot { margin-top: 26px; text-align: center; color: var(--mist); font-size: .75rem; }

  /* ---------- share sheet ---------- */
  .sheet-wrap { position: fixed; inset: 0; z-index: 30; display: grid; align-items: end; justify-items: center; background: rgba(2, 6, 18, .72); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); padding: 0 max(0px, env(safe-area-inset-left, 0px)) 0 max(0px, env(safe-area-inset-right, 0px)); }
  .sheet {
    width: min(100%, 520px); padding: 18px 20px calc(22px + env(safe-area-inset-bottom, 0px)); border-radius: 26px 26px 0 0;
    background: linear-gradient(160deg, var(--card-a), var(--card-b)); color: var(--ice); border: 1px solid var(--c-line-strong); border-bottom: 0;
    animation: sheet-in .35s cubic-bezier(.2, .8, .2, 1) both;
  }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
  .sheet-head h2 { font: 600 1.05rem/1.2 var(--display); }
  .x { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--c-line-strong); background: rgba(4, 10, 28, .6); display: grid; place-items: center; cursor: pointer; }
  .x:hover { border-color: var(--cyan); }
  .opts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px 8px; }
  .opt { display: grid; justify-items: center; gap: 7px; padding: 6px 2px; text-decoration: none; background: none; border: 0; cursor: pointer; font-size: .74rem; font-weight: 500; color: var(--ice); border-radius: 14px; }
  .opt span.c { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; color: var(--cyan); background: rgba(25, 200, 225, .1); border: 1px solid rgba(25, 200, 225, .32); transition: background .2s ease, border-color .2s ease; }
  .opt:hover span.c { background: rgba(25, 200, 225, .24); border-color: var(--cyan); }
  .sheet-url { margin-top: 16px; }

  .toast {
    position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 12px);
    max-width: min(92vw, 420px); padding: 11px 16px; border-radius: 14px; font-size: .9rem;
    background: var(--deep); color: var(--ice); border: 1px solid var(--c-line-strong);
    opacity: 0; pointer-events: none; transition: opacity .25s ease, transform .25s ease; z-index: 40;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast.bad { border-color: var(--err); }

  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes sheet-in { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) {
    .card, .sheet { animation: none; transition: none; }
    .btn, .ic, .toast, .quick a, .chev, .opt span.c { transition: none; }
  }
</style>

<main class="page">
  <div class="tilt" id="tilt">
    <article class="card" aria-labelledby="co-name">
      <div class="slot" aria-hidden="true"></div>

  function $(id) { return document.getElementById(id); }
  function svg(name) { return '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true">' + ICONS[name] + '</svg>'; }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function digits(s) { return String(s).replace(/\D/g, ""); }
  function isHttp(u) { return /^https?:\/\//i.test(u || ""); }
  function telHref(p) { return "tel:" + (p.trim().charAt(0) === "+" ? "+" : "") + digits(p); }
  function officeLine(o) { return [o.street, o.city, [o.region, o.postal].filter(Boolean).join(" ")].filter(Boolean).join(", "); }
  function pad(n) { return n < 10 ? "0" + n : String(n); }
  function wa(msg) { return "https://wa.me/" + digits(CONFIG.whatsapp) + (msg ? "?text=" + encodeURIComponent(msg) : ""); }
  function ext(href) { return isHttp(href) ? ' target="_blank" rel="noopener noreferrer"' : ""; }

  var cardUrl = CONFIG.cardUrl || String(location.href).split("#")[0];
  var siteLabel = CONFIG.siteBase.replace(/^https?:\/\//i, "").replace(/\/$/, "");
  var shareTitle = CONFIG.company + " | " + CONFIG.tagline;
  var shareText = CONFIG.company + ": " + CONFIG.tagline;

  /* ---------- toast + copy ---------- */
  var toastTimer;
  function toast(msg, bad) {
    var t = $("toast");
    t.textContent = msg;
    t.classList.toggle("bad", !!bad);
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove("show"); }, 3200);
  }
  function fallbackCopy(text) {
    var f = document.createElement("textarea");
    f.value = text; f.setAttribute("readonly", "");
    f.style.cssText = "position:fixed;top:0;left:0;opacity:0";
    document.body.appendChild(f); f.select();
    var ok = false;
    try { ok = document.execCommand("copy"); } catch (e) {}
    f.remove();
    return ok;
  }
  function copyText(text, okMsg) {
    function done(ok) { ok ? toast(okMsg) : toast("Couldn't copy automatically. Select the text and copy it.", true); }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { done(true); }, function () { done(fallbackCopy(text)); });
    } else { done(fallbackCopy(text)); }
  }

  /* ---------- header ---------- */
  var h1 = $("co-name");
  h1.innerHTML = esc(CONFIG.tagline).replace(/(Smart Growth)$/, "<em>$1</em>");
  $("about").textContent = CONFIG.about;
  $("card-url").textContent = cardUrl;
  $("sheet-url").textContent = cardUrl;
  $("foot").textContent = "© " + new Date().getFullYear() + " " + CONFIG.company + ". All rights reserved.";
  document.title = CONFIG.company + " | Digital Card";

  var quick = [];
  if (CONFIG.phone) quick.push({ icon: "phone", label: "Call", href: telHref(CONFIG.phone) });
  if (CONFIG.whatsapp) quick.push({ icon: "whatsapp", label: "WhatsApp", href: wa("Hi Zytexa, I'd like to discuss a project.") });
  if (CONFIG.email) quick.push({ icon: "mail", label: "Email", href: "mailto:" + CONFIG.email });
  $("quick").innerHTML = quick.map(function (q) { return '<a href="' + esc(q.href) + '"' + ext(q.href) + '>' + svg(q.icon) + esc(q.label) + '</a>'; }).join("");

  /* ---------- services ---------- */
  var services = DATA.services, total = services.length;
  $("svc-h").innerHTML = '<em>' + total + ' services.</em> Four ways we move your business forward.';
  var n = 0;
  $("pillars").innerHTML = PILLARS.map(function (p) {
    var list = services.filter(function (s) { return s.pillar === p.name; });
    var html = '<section class="pillar" aria-labelledby="p-' + p.name + '"><div class="pillar-head"><span class="pic">' + svg(p.icon) + '</span><div><h3 class="pillar-name" id="p-' + p.name + '">' + esc(p.name) + '</h3><p class="pillar-desc">' + esc(p.desc) + '</p></div><span class="pcount">' + list.length + ' services</span></div>';
    html += '<ul class="svcs">';
    list.forEach(function (s) {
      n += 1;
      html += '<li class="svc"><a class="srow" href="' + esc(wa("Hi Zytexa, I'm interested in " + s.t + ". Can we talk?")) + '" target="_blank" rel="noopener noreferrer"><span class="num">' + pad(n) + '</span><span class="stxt"><b>' + esc(s.t) + '</b><small>' + esc(s.tag) + '</small></span></a></li>';
    });
    html += '</ul>';
    return html + '</section>';
  }).join("");

  /* ---------- contact rows ---------- */
  var rows = [];

  if (CONFIG.phone2) rows.push({ icon: "phone", label: "Call alternate", value: CONFIG.phone2, href: telHref(CONFIG.phone2) });
  if (CONFIG.whatsapp) rows.push({ icon: "whatsapp", label: "WhatsApp", value: CONFIG.whatsapp, href: wa("Hi Zytexa, I'd like to discuss a project.") });
  if (CONFIG.email) rows.push({ icon: "mail", label: "Email", value: CONFIG.email, href: "mailto:" + CONFIG.email });
  if (CONFIG.email2) rows.push({ icon: "mail", label: "Email alternate", value: CONFIG.email2, href: "mailto:" + CONFIG.email2 });

  CONFIG.offices.forEach(function (o) {
    var line = officeLine(o);

  });
  $("rows").innerHTML = rows.map(function (r, i) {
    return '<li class="row"><a class="row-main" href="' + esc(r.href) + '"' + ext(r.href) + ' aria-label="' + esc(r.label + ": " + r.value) + '">' +

  $("rows").addEventListener("click", function (e) {
    var b = e.target.closest(".copy");

  /* ---------- share: native sheet when available, otherwise this in-page sheet ---------- */
  var sheet = $("sheet"), lastFocus = null;
  var enc = encodeURIComponent;
  var shareOptions = [
    { id: "wa", icon: "whatsapp", label: "WhatsApp", href: "https://wa.me/?text=" + enc(shareText + " " + cardUrl) },
    { id: "tg", icon: "telegram", label: "Telegram", href: "https://t.me/share/url?url=" + enc(cardUrl) + "&text=" + enc(shareText) },

    { id: "mail", icon: "mail", label: "Email", href: "mailto:?subject=" + enc(shareTitle) + "&body=" + enc(shareText + "\n" + cardUrl) },
    { id: "copy", icon: "copy", label: "Copy link" }
  ];
  if (navigator.share) shareOptions.push({ id: "more", icon: "more", label: "More apps" });

  $("opts").innerHTML = shareOptions.map(function (o) {
    var inner = '<span class="c">' + svg(o.icon) + '</span>' + esc(o.label);
    return o.href ? '<a class="opt" href="' + esc(o.href) + '"' + ext(o.href) + '>' + inner + '</a>'
                  : '<button class="opt" type="button" data-act="' + o.id + '">' + inner + '</button>';
  }).join("");

  function openSheet() {
    lastFocus = document.activeElement;
    sheet.hidden = false;
    $("sheet-close").focus();
  }
  function closeSheet() {
    sheet.hidden = true;
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }
  function nativeShare() {
    return navigator.share({ title: shareTitle, text: shareText, url: cardUrl });
  }

  $("share").addEventListener("click", function () {
    if (navigator.share) {
      nativeShare().catch(function (err) {
        if (err && err.name === "AbortError") return;
        openSheet();
      });
    } else { openSheet(); }
  });
  $("sheet-close").addEventListener("click", closeSheet);
  sheet.addEventListener("click", function (e) { if (e.target === sheet) closeSheet(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !sheet.hidden) closeSheet(); });
  $("opts").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-act]");
    if (!b) return;
    if (b.getAttribute("data-act") === "copy") copyText(cardUrl, "Link copied.");
    if (b.getAttribute("data-act") === "more") nativeShare().catch(function () {});
  });
  $("copy-link").addEventListener("click", function () { copyText(cardUrl, "Link copied."); });

  /* ---------- QR ---------- */
  (function () {
    var box = $("qr");
    try {
      if (typeof qrcode !== "function") throw new Error("qr library missing");
      var qr = qrcode(0, "M");
      qr.addData(cardUrl);
      qr.make();
      box.innerHTML = qr.createSvgTag(6, 0);
      var s = box.querySelector("svg");
      if (!s.getAttribute("viewBox")) s.setAttribute("viewBox", "0 0 " + parseFloat(s.getAttribute("width")) + " " + parseFloat(s.getAttribute("height")));
      s.removeAttribute("width"); s.removeAttribute("height");
      s.setAttribute("aria-hidden", "true");
    } catch (e) {
      box.textContent = "QR code could not be generated here. Copy the link instead.";
    }
  })();

  /* ---------- card tilt (fine pointers only, off for reduced motion) ---------- */
  (function () {
    var wrap = $("tilt"), card = wrap.firstElementChild;
    if (!matchMedia("(hover: hover) and (pointer: fine)").matches || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    wrap.addEventListener("pointermove", function (e) {
      var r = wrap.getBoundingClientRect(), x = (e.clientX - r.left) / r.width - 0.5, y = (e.clientY - r.top) / r.height - 0.5;
      card.style.setProperty("--ry", (x * 3).toFixed(2) + "deg");
      card.style.setProperty("--rx", (-y * 1.2).toFixed(2) + "deg");
      card.style.setProperty("--gx", (x * 100 + 50).toFixed(0) + "%");
      card.style.setProperty("--gy", (y * 100 + 50).toFixed(0) + "%");
    });
    wrap.addEventListener("pointerleave", function () {
      card.style.setProperty("--ry", "0deg"); card.style.setProperty("--rx", "0deg");
      card.style.setProperty("--gx", "50%"); card.style.setProperty("--gy", "0%");
    });
  })();
